; VoxGuard Asterisk HTTP Configuration
; Reference config for LAN/hackathon demo

[general]
enabled=yes

; ARI REST API — bind to localhost only (private)
bindaddr=127.0.0.1
bindport=8088

; Browser SIP/WebRTC over TLS (WSS)
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.crt
tlsprivatekey=/etc/asterisk/keys/asterisk.key

; For LAN demo with self-signed cert:
;   1. Generate: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
;        -keyout /etc/asterisk/keys/asterisk.key \
;        -out /etc/asterisk/keys/asterisk.crt \
;        -subj "/CN=pbx.local"
;   2. Trust the cert in your browser or use --ignore-certificate-errors for Chrome
;   3. For production, use a real certificate (e.g., Let's Encrypt)
