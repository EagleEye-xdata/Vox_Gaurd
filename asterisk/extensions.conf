; VoxGuard Asterisk Dialplan
; Reference config for LAN/hackathon demo

[from-voxguard]

; ---------------------------------------------------------------------------
; Normal extension dialing (for pre-integration testing)
; ---------------------------------------------------------------------------

exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,VoiceMail(1002@default,u)
 same => n,Hangup()

exten => 1003,1,Dial(PJSIP/1003,30)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 7000 — Monitored Call (enters VoxGuard ARI application)
;
; When dialed, the caller enters the Stasis(voxguard) application.
; The Go ARI controller receives StasisStart and orchestrates:
;   - Call bridge + callee origination
;   - Caller-leg snoop for isolated audio
;   - ExternalMedia → media adapter → detector
; ---------------------------------------------------------------------------

exten => 7000,1,NoOp(VoxGuard monitored call)
 same => n,Stasis(voxguard,target=1002)
 same => n,Hangup()

; Monitor call to extension 1003
exten => 7003,1,NoOp(VoxGuard monitored call to 1003)
 same => n,Stasis(voxguard,target=1003)
 same => n,Hangup()

; ---------------------------------------------------------------------------
; 6000 — IVR Demo
; ---------------------------------------------------------------------------

exten => 6000,1,Answer()
 same => n,Wait(1)
 same => n,Playback(demo-congrats)
 same => n,Background(demo-instruct)
 same => n,WaitExten(10)

; IVR option 1: Monitored agent call
exten => 1,1,Stasis(voxguard,target=1002)
 same => n,Hangup()

; IVR option 2: Voicemail
exten => 2,1,VoiceMail(1002@default,u)
 same => n,Hangup()

; IVR timeout
exten => t,1,Playback(vm-goodbye)
 same => n,Hangup()

; IVR invalid
exten => i,1,Playback(invalid)
 same => n,Goto(6000,1)

; ---------------------------------------------------------------------------
; Catch-all for unknown extensions
; ---------------------------------------------------------------------------

exten => _X.,1,NoOp(Unknown extension ${EXTEN})
 same => n,Congestion(10)
 same => n,Hangup()
