; VoxGuard Asterisk PJSIP Configuration
; Reference config for LAN/hackathon demo
;
; Extensions:
;   1001 = Suspicious caller (browser via SIP.js or Linphone)
;   1002 = Agent/receiving user (browser via SIP.js or Linphone)
;
; IMPORTANT: Replace passwords before use!

; ---------------------------------------------------------------------------
; Transports
; ---------------------------------------------------------------------------

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ---------------------------------------------------------------------------
; Extension 1001 — Suspicious Caller (Browser WebRTC)
; ---------------------------------------------------------------------------

[1001]
type=aor
max_contacts=1
remove_existing=yes

[1001]
type=auth
auth_type=userpass
username=1001
password=REPLACE_WITH_A_LONG_RANDOM_SECRET_1001

[1001]
type=endpoint
aors=1001
auth=1001
context=from-voxguard
disallow=all
allow=opus,ulaw

; Enables WebRTC-related DTLS/ICE/RTCP-mux
webrtc=yes
dtls_auto_generate_cert=yes

; Keep Asterisk in the media path for snoop to work
direct_media=no

; ---------------------------------------------------------------------------
; Extension 1002 — Agent / Receiving User (Browser WebRTC)
; ---------------------------------------------------------------------------

[1002]
type=aor
max_contacts=1
remove_existing=yes

[1002]
type=auth
auth_type=userpass
username=1002
password=REPLACE_WITH_A_LONG_RANDOM_SECRET_1002

[1002]
type=endpoint
aors=1002
auth=1002
context=from-voxguard
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no

; ---------------------------------------------------------------------------
; Extension 1003 — Optional Linphone / desktop SIP softphone
; ---------------------------------------------------------------------------

[1003]
type=aor
max_contacts=1
remove_existing=yes

[1003]
type=auth
auth_type=userpass
username=1003
password=REPLACE_WITH_A_LONG_RANDOM_SECRET_1003

[1003]
type=endpoint
aors=1003
auth=1003
context=from-voxguard
disallow=all
allow=ulaw,alaw,opus
direct_media=no
