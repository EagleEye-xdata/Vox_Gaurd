[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "voxguard"
version = "1.0.0"
description = "VoxGuard AI — Python SDK for real-time AI voice clone detection"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
enrol = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/youorg/vox_gaurd"
